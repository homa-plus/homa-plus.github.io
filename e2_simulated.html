<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>График E2</title>

    <script src="assets/js/e2_simulated.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="assets/css/main_style.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3 class="mb-0">Симуляция уровня эстрадиола после нанесения геля</h3>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="e2Chart"></canvas>
                    </div>
                    <div class="row g-3 align-items-center mb-4">
                        <div class="col-md-4">
                            <label for="dosageE2" class="form-label">Дозировка E2 mg</label>
                            <input type="number" id="dosageE2" class="form-control" value="2" step="0.25">
                        </div>

						<div class="col-md-4">
                            <label for="gTime" class="form-label">Время ч</label>
                            <input type="number" id="gTime" class="form-control" value="72" step="8">
                        </div>

						<div class="col-md-4">
                            <label for="aeraSize" class="form-label">Площадь см²</label>
                            <input type="number" id="aeraSize" class="form-control" value="2" step="0.5">
                        </div>

						<div class="col-md-4">
                            <label for="bodyWeightKg" class="form-label">Вес</label>
                            <input type="number" id="bodyWeightKg" class="form-control" value="60" step="1">
                        </div>
                        
                        <div class="col-md-4">
                            <label for="aeraType" class="form-label">Область (коэффицент)</label>
                            <select id="aeraType" class="form-select">
                                <option value="0.50" selected>Бедро (0.5)</option>
                                <option value="0.40">Ягодицы (0.4)</option>
								<option value="0.75">Живот (0.75)</option>
								<option value="1.0">Плечи (1.0)</option>
                            </select>
                        </div>

						<div class="col-md-4">
                            <label for="repeatType" class="form-label">График</label>
                            <select id="repeatType" class="form-select">
								<option value="0" selected>без повторов</option>
                                <option value="8">8 часов</option>
                                <option value="12">12 часов</option>
								<option value="24">24 часа</option>
								<option value="48">48 часов</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<script>
    const ctx = document.getElementById('e2Chart').getContext('2d');
    let e2Chart;

    function updateChart() {
		let gSize = parseInt(gTime.value) || 72
		let dosage = parseFloat(dosageE2.value) || 0;
        let absorbation = parseFloat(aeraType.value) || 0.5;
		let bodyWeight = parseFloat(bodyWeightKg.value)
		let repeat = parseInt(repeatType.value)

		let aeraSize0 = 2.0
		if(aeraSize){
			aeraSize0 = parseFloat(aeraSize.value)
		}

		try{
			parseFloat(aeraE2.value) || 2.0;
		} catch {}

        const isDashed = false; 
        const showGrid = true;

        const dataE2 = simulate(dosage, absorbation, aeraSize0, bodyWeight, gSize, repeat);

        if (e2Chart) {
            e2Chart.destroy();
        }

        e2Chart = new Chart(ctx, {
            type: 'scatter', 
            data: {
                datasets: [
                    {
                        label: `E2 pg/ml`,
                        data: dataE2,
                        borderColor: '#ff84c7',
                        borderWidth: 2,
                        showLine: true,
                        pointRadius: 0,
                        borderDash: isDashed ? [5, 5] : [],
                        tension: 0.1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'linear',
                        position: 'left',
                        min: 0,
                        max: gSize,
                        grid: {
                            display: showGrid
                        }
                    },
                    y: {
                        type: 'linear',
                        position: 'left',
                        min: 0,
                        max: 370,
                        grid: {
                            display: showGrid
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    },
					highlightY: [
						{
							min: 350,
							max: 370,
							color: 'rgba(255, 0, 0, 0.5)'
						},
						{
							min: 300,
							max: 350,
							color: 'rgba(255, 0, 0, 0.25)'
						},
						{
							min: 200,
							max: 300,
							color: 'rgba(0, 255, 0, 0.15)'
						}
					]
                }
            },
			plugins: [highlightY]
        });
    }

    dosageE2.addEventListener('input', updateChart);
    aeraType.addEventListener('change', updateChart);
	gTime.addEventListener('input', updateChart);

	bodyWeightKg.addEventListener('input', updateChart);
	repeatType.addEventListener('change', updateChart);

	if(aeraSize){
		aeraSize.addEventListener('input', updateChart);
	}
	
    updateChart();
</script>

</body>
</html>
